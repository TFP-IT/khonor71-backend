[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/khonor71-backend/artisan octane:start --server=roadrunner --port=8000 --workers=auto --max-requests=500
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/khonor71-backend/storage/logs/octane-supervisor.log
stopwaitsecs=30
stopsignal=SIGTERM
